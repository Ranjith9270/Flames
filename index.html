<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FLAMES — Relationship Calculator</title>

  <style>
    :root{
      --bg1: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      --card: rgba(255,255,255,0.85);
      --accent: #d6336c;
      --muted: #666;
      --glass: rgba(255,255,255,0.55);
    }

    *{ box-sizing:border-box }

    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      background: var(--bg1);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      color:#222;
    }

    /* CENTER WRAPPER */
    .wrap{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* HERO CARD */
    .hero{
      max-width:420px;
      width:100%;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.6),
        rgba(255,255,255,0.35)
      );
      padding:28px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      backdrop-filter: blur(6px) saturate(120%);
    }

    h1{
      margin:0 0 12px;
      font-size:26px;
      text-align:center;
    }

    .form-row{
      display:flex;
      gap:12px;
      margin-bottom:12px;
    }

    input{
      flex:1;
      padding:12px 14px;
      border-radius:10px;
      border:1px solid rgba(0,0,0,0.1);
      font-size:15px;
      background:transparent;
      outline:none;
    }

    .controls{
      display:flex;
      gap:10px;
      margin-top:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    button{
      padding:10px 14px;
      border-radius:10px;
      border:0;
      cursor:pointer;
      font-weight:600;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
    }

    button.primary{
      background:linear-gradient(90deg,#ff7a9a,#d6336c);
      color:#fff;
    }

    button.ghost{
      background:var(--glass);
    }

    .result-card{
      margin-top:14px;
      background:var(--card);
      padding:18px;
      border-radius:12px;
      text-align:center;
    }

    .final-result{
      display:inline-block;
      margin-top:10px;
      padding:12px 18px;
      border-radius:12px;
      font-weight:800;
      font-size:18px;
      background:linear-gradient(90deg,#fff3f6,#ffe5ef);
      color:#b2003a;
      box-shadow:0 8px 30px rgba(214,51,108,0.12);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <h1>FLAMES — Calculator</h1>

      <div class="form-row">
        <input id="name1" type="text" placeholder="Enter first name">
        <br>
        <input id="name2" type="text" placeholder="Enter second name">
      </div>

      <div class="controls">
        <button class="primary" onclick="calculate()">Calculate</button>
        <button class="ghost" onclick="clearAll()">Clear</button>
      </div>

      <div class="result-card" id="result">
        Result will appear here after calculation.
      </div>
    </div>
  </div>

  <script>
    function normalize(s){
      return s.toLowerCase().replace(/[^a-z]/g,'');
    }

    function calculate(){
      const a = normalize(name1.value);
      const b = normalize(name2.value);

      if(!a || !b){
        result.innerHTML = "<span style='color:#a33'>Enter both names</span>";
        return;
      }

      let freq = Array(26).fill(0);
      for(let c of a) freq[c.charCodeAt(0)-97]++;
      for(let c of b){
        let i = c.charCodeAt(0)-97;
        freq[i] = freq[i] ? freq[i]-1 : freq[i]+1;
      }

      let count = freq.reduce((s,v)=>s+Math.abs(v),0);
      let flames = ['F','L','A','M','E','S'];
      let idx = 0;

      while(flames.length > 1){
        idx = (idx + count - 1) % flames.length;
        flames.splice(idx,1);
      }

      const map = {
        F:'Friends',
        L:'Love',
        A:'Affection',
        M:'Marriage',
        E:'Enemy',
        S:'Siblings'
      };

      result.innerHTML = `
        Result:
        <div class="final-result">
          ${flames[0]} — ${map[flames[0]]}
        </div>
      `;
    }

    function clearAll(){
      name1.value = "";
      name2.value = "";
      result.innerHTML = "Result will appear here after calculation.";
    }
  </script>
</body>
</html>
